{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow border-0 rounded-4 mt-4">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0 fw-bold">Crea tu cuenta</h4>
            </div>
            <div class="card-body p-4">
                <form action="/registro" method="POST" id="formRegistro">
                    
                    <!-- Incluye el selector de tipo_doc y el input de documento -->
                    {% include 'consulta_api.html' %}

                    <!-- Campos para Persona Natural (DNI, CE, Pasaporte, Otro) -->
                    <div id="campos_dni">
                        <div class="mb-3">
                            <label class="fw-bold text-secondary">Nombres</label>
                            <input type="text" name="nombres" id="nombres" class="form-control bg-light" required readonly>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="fw-bold text-secondary">A. Paterno</label>
                                <input type="text" name="apellido_paterno" id="apellido_paterno" class="form-control bg-light" required readonly>
                            </div>
                            <div class="col-6">
                                <label class="fw-bold text-secondary">A. Materno</label>
                                <input type="text" name="apellido_materno" id="apellido_materno" class="form-control bg-light" required readonly>
                            </div>
                        </div>
                    </div>

                    <!-- Campos para Empresa (RUC) -->
                    <div id="campos_ruc" style="display: none;">
                        <div class="mb-3">
                            <label class="fw-bold text-secondary">Razón Social</label>
                            <input type="text" name="razon_social" id="razon_social" class="form-control bg-light" readonly>
                        </div>
                    </div>
                    
                    <hr class="my-4">

                    <!-- CORREO Y TELÉFONO -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="fw-bold text-secondary">Correo Electrónico</label>
                            <input type="email" name="correo" class="form-control" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="col-md-6">
                            <label for="telefono" class="fw-bold text-secondary">Teléfono / Celular</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">+51</span>
                                <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="999 888 777" required>
                            </div>
                        </div>
                    </div>

                    <!-- UBICACIÓN: DEPARTAMENTO, PROVINCIA Y DISTRITO -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="departamento" class="fw-bold text-secondary">Departamento</label>
                            <select id="departamento" name="departamento" class="form-select" required>
                                <option value="">Seleccione...</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="provincia" class="fw-bold text-secondary">Provincia</label>
                            <select id="provincia" name="provincia" class="form-select" required disabled>
                                <option value="">Seleccione...</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="distrito" class="fw-bold text-secondary">Distrito</label>
                            <select id="distrito" name="distrito" class="form-select" required disabled>
                                <option value="">Seleccione...</option>
                            </select>
                        </div>
                    </div>

                    <!-- DIRECCIÓN / DOMICILIO -->
                    <div class="mb-3">
                        <label for="domicilio" class="fw-bold text-secondary">Domicilio / Dirección completa</label>
                        <input type="text" class="form-control" id="domicilio" name="domicilio" placeholder="Ej. Av. Los Pinos 123" required>
                    </div>
                    
                    <!-- CONTRASEÑA -->
                    <div class="mb-4">
                        <label class="fw-bold text-secondary">Contraseña</label>
                        <input type="password" name="clave" class="form-control" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Registrarme</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- LÓGICA JAVASCRIPT: UBIGEO Y TIPO DE DOCUMENTO -->

        "HUARAL": ["HUARAL", "ATAVILLOS ALTO", "ATAVILLOS BAJO", "ACOS", "CHANCAY", "LUMPIAN", "PACARAOS", "SANTA CRUZ DE ANDAMARCA", "SUMBILCA", "VEINTINUEVE DE NOVIEMBRE"]
    },
    "AREQUIPA": {
        "AREQUIPA": ["AREQUIPA", "ALTO SELVA ALEGRE", "CAYMA", "CERRO COLORADO", "CHARACATO", "CHIGUATA", "JACOBO HUNTER", "LA JOYA", "MARIANO MELGAR", "MIRAFLORES", "PAVIPATA", "PAUCARPATA", "SABANDÍA", "SACHACA", "SAN ANTONIO DE CHUCA", "SAN JUAN DE SIGUAS", "SAN JUAN DE TARUCANI", "SANTA ISABEL DE SIGUAS", "SANTA RITA DE SIGUAS", "SOCABAYA", "TIABAYA", "UCHUMAYO", "VÍCTOR LARCO", "YANAHUARA", "YARABAMBA", "YURA"],
        "CAMANÁ": ["CAMANÁ", "JOSÉ MARÍA QUIMPER", "MARIANO NICOLÁS VALCÁRCEL", "MARISCAL CÁCERES", "NICOLÁS DE PIÉROLA", "OCOÑA", "QUILCA", "SAMUEL PASTOR"],

        "SULLANA": ["SULLANA", "BELLAVISTA", "IGNACIO ESCUDERO", "LANCONES", "MARCAVELICA", "QUERECOTILLO", "SALITRAL"]

        "CUSCO": ["CUSCO", "CCORCA", "POROY", "SAN JERÓNIMO", "SAN SEBASTIÁN", "SANTIAGO", "SAYLLA", "WANCHAQ"]
    },
    "JUNIN": {
        "HUANCAYO": ["HUANCAYO", "CARHUACALLANGA", "CHACAPAMPA", "CHICCHE", "CHILCA", "CHONGOS ALTO", "CHUPURO", "EL TAVO", "HUANCÁN", "HUASICANCHA", "HUAYUCACHI", "INGENIO", "PARIAHUANCA", "PILCOMAYO", "PUCARÁ", "QUICHUAY", "QUILCAS", "SAN AGUSTÍN", "SAN JERÓNIMO DE TUNÁN", "SAÑO", "SAPALLANGA", "SICAYA", "SANTO DOMINGO DE ACOBAMBA", "VIQUES"]
    },
    "ANCASH": {
        "SANTA": ["CHIMBOTE", "CÁCERES DEL PERÚ", "COISHCO", "NEPEÑA", "MACATE", "MORO", "NUEVO CHIMBOTE", "SAMANCO", "SANTA"],
        "HUARAZ": ["HUARAZ", "INDEPENDENCIA", "COCHABAMBA", "COLCABAMBA", "JANGAS", "LA LIBERTAD", "OLLEROS", "PAMPAS", "PIRA", "TARICA"]
    }
};

document.addEventListener('DOMContentLoaded', function() {
    const selectDep = document.getElementById('departamento');
    const selectProv = document.getElementById('provincia');
    const selectDist = document.getElementById('distrito');

    for (let dep in ubigeoPeru) {
        let opt = document.createElement('option');
        opt.value = dep;
        opt.textContent = dep;
        selectDep.appendChild(opt);
    }

    selectDep.addEventListener('change', function() {
        selectProv.innerHTML = '<option value="">Seleccione...</option>';
        selectDist.innerHTML = '<option value="">Seleccione...</option>';
        selectProv.disabled = true;
        selectDist.disabled = true;

        const depSel = this.value;
        if (depSel && ubigeoPeru[depSel]) {
            for (let prov in ubigeoPeru[depSel]) {
                let opt = document.createElement('option');
                opt.value = prov;
                opt.textContent = prov;
                selectProv.appendChild(opt);
            }
            selectProv.disabled = false;
        }
    });

    selectProv.addEventListener('change', function() {
        selectDist.innerHTML = '<option value="">Seleccione...</option>';
        selectDist.disabled = true;

        const depSel = selectDep.value;
        const provSel = this.value;

        if (depSel && provSel && ubigeoPeru[depSel][provSel]) {
            ubigeoPeru[depSel][provSel].forEach(function(dist) {
                let opt = document.createElement('option');
                opt.value = dist;
                opt.textContent = dist;
                selectDist.appendChild(opt);
            });
            selectDist.disabled = false;
        }
    });

    const selectTipoDoc = document.getElementById('tipo_doc') || document.querySelector('select[name="tipo_doc"]');
    if (selectTipoDoc) {
        selectTipoDoc.addEventListener('change', actualizarFormulario);
        actualizarFormulario();
    }

    function actualizarFormulario() {
        const valorTipo = selectTipoDoc ? selectTipoDoc.value.toLowerCase() : 'dni';
        const divDni = document.getElementById('campos_dni');
        const divRuc = document.getElementById('campos_ruc');
        const inputsDni = divDni.querySelectorAll('input');
        const inputRuc = document.getElementById('razon_social');

        if (valorTipo === 'ruc') {
            divDni.style.display = 'none';
            divRuc.style.display = 'block';
            inputsDni.forEach(i => i.removeAttribute('required'));
            if (inputRuc) inputRuc.setAttribute('required', 'required');
        } else {
            divDni.style.display = 'block';
            divRuc.style.display = 'none';
            inputsDni.forEach(i => i.setAttribute('required', 'required'));
            if (inputRuc) inputRuc.removeAttribute('required');

            const esManual = (valorTipo === 'ce' || valorTipo === 'pasaporte' || valorTipo === 'otro');
            inputsDni.forEach(i => {
                if (esManual) {
                    i.removeAttribute('readonly');
                    i.classList.remove('bg-light');
                } else {
                    i.setAttribute('readonly', 'readonly');
                    i.classList.add('bg-light');
                }
            });
        }
    }
});

function seleccionarUbigeo(dep, prov, dist) {
    const selectDep = document.getElementById('departamento');
    const selectProv = document.getElementById('provincia');
    const selectDist = document.getElementById('distrito');

    if (!dep) return;
    
    selectDep.value = dep.toUpperCase();
    selectDep.dispatchEvent(new Event('change'));

    if (prov) {
        selectProv.value = prov.toUpperCase();
        selectProv.dispatchEvent(new Event('change'));
    }

    if (dist) {
        selectDist.value = dist.toUpperCase();
    }
}
</script>
{% endblock %}

{% extends 'base.html' %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-lg border-0 rounded-4">
                
                <!-- ENCABEZADO -->
                <div class="card-header bg-dark text-white p-4">
                    <h4 class="mb-0">
                        <i class="bi bi-person-plus-fill me-2 text-info"></i>
                        Registrar Personal del Sistema
                    </h4>
                    <p class="small opacity-75 mb-0">
                        Crea una nueva cuenta con perfil administrativo para el personal.
                    </p>
                </div>

                <!-- FORMULARIO -->
                <div class="card-body p-4">
                    <form action="/admin/nuevo_usuario_sistema" method="POST">
                        
                        <!-- NOMBRE COMPLETO -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombres y Apellidos</label>
                            <input type="text" name="nombre_completo" class="form-control" placeholder="Ej. Juan Pérez" required>
                        </div>

                        <!-- DOCUMENTO DE IDENTIDAD -->
                        <div class="row mb-3">
                            <div class="col-md-5">
                                <label class="form-label fw-bold">Tipo Doc.</label>
                                <select name="id_tipo_documento" class="form-select" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                    {% for doc in tipos_doc %}
                                        <option value="{{ doc[0] }}">{{ doc[1] }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-7">
                                <label class="form-label fw-bold">Número de Documento</label>
                                <input type="text" name="documento" class="form-control" placeholder="Ej. 72635418" required>
                            </div>
                        </div>

                        <!-- CONTACTO -->
                        <div class="row mb-3">
                            <div class="col-md-7">
                                <label class="form-label fw-bold">Correo Electrónico</label>
                                <input type="email" name="correo" class="form-control" placeholder="personal@tetracolor.com" required>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label fw-bold">Teléfono / Celular</label>
                                <input type="tel" name="telefono" class="form-control" placeholder="Ej. 987654321">
                            </div>
                        </div>

                        <!-- DOMICILIO -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Domicilio / Dirección</label>
                            <input type="text" name="direccion" class="form-control" placeholder="Ej. Av. Los Olivos 456, Lima">
                        </div>

                        <!-- ROL Y ESTADO -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Rol</label>
                                <select name="rol" class="form-select" required>
                                    <option value="administrador">Administrador</option>
                                    <option value="asistente">Asistente</option>
                                    <option value="consultor">Consultor</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Estado</label>
                                <select name="estado" class="form-select" required>
                                    <option value="Activo">Activo</option>
                                    <option value="Inactivo">Inactivo</option>
                                </select>
                            </div>
                        </div>

                        <!-- CONTRASEÑA -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Contraseña de Acceso</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <!-- BOTONES DE ACCIÓN -->
                        <div class="d-flex justify-content-between pt-2">
                            <a href="/pedidos" class="btn btn-outline-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-check-lg me-1"></i> Guardar Personal
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock %}

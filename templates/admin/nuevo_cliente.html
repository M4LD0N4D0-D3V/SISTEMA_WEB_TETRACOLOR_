{% extends 'base.html' %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-lg border-0 rounded-4">

                <!-- HEADER -->
                <div class="card-header bg-tetra-dark text-white p-4">
                    <h4 class="mb-0">
                        <i class="bi bi-person-plus-fill me-2"></i>
                        Registro de Cliente Presencial
                    </h4>
                    <p class="small opacity-75 mb-0">
                        Rellena los datos para crear la cuenta del cliente en el sistema.
                    </p>
                </div>

                <!-- BODY -->
                <div class="card-body p-4">

                    <form action="/registro_presencial" method="POST" id="formNuevoCliente">

                        <!-- API DE CONSULTA Y TIPO DOCUMENTO -->
                        {% include 'consulta_api.html' %}

                        <!-- CAMPOS PERSONA NATURAL (DNI, CE, PASAPORTE, OTRO) -->
                        <div id="campos_dni">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombres</label>
                                <input type="text" name="nombres" id="nombres" class="form-control bg-light" required readonly>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">A. Paterno</label>
                                    <input type="text" name="apellido_paterno" id="apellido_paterno" class="form-control bg-light" required readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">A. Materno</label>
                                    <input type="text" name="apellido_materno" id="apellido_materno" class="form-control bg-light" required readonly>
                                </div>
                            </div>
                        </div>

                        <!-- CAMPOS EMPRESA (RUC) -->
                        <div id="campos_ruc" style="display:none;">
                            <div class="mb-3 mt-3">
                                <label class="form-label fw-bold">Razón Social</label>
                                <input type="text" name="razon_social" id="razon_social" class="form-control bg-light" readonly>
                            </div>
                        </div>

                        <hr class="my-4">

                        <!-- CORREO Y TELEFONO -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Correo Electrónico</label>
                                <input type="email" name="correo" class="form-control" placeholder="cliente@correo.com" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Teléfono / Celular</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">+51</span>
                                    <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="999 888 777" required>
                                </div>
                            </div>
                        </div>

                        <!-- UBICACIÓN: DEPARTAMENTO, PROVINCIA Y DISTRITO -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="departamento" class="form-label fw-bold">Departamento</label>
                                <select id="departamento" name="departamento" class="form-select" required>
                                    <option value="">Seleccione...</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="provincia" class="form-label fw-bold">Provincia</label>
                                <select id="provincia" name="provincia" class="form-select" required disabled>
                                    <option value="">Seleccione...</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="distrito" class="form-label fw-bold">Distrito</label>
                                <select id="distrito" name="distrito" class="form-select" required disabled>
                                    <option value="">Seleccione...</option>
                                </select>
                            </div>
                        </div>

                        <!-- DIRECCIÓN / DOMICILIO -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Domicilio / Dirección (Calle, Av., Jr., N°)</label>
                            <input type="text" class="form-control" id="domicilio" name="domicilio" placeholder="Ej. Av. Los Pinos 123, Urb. El Sol" required>
                        </div>

                        <!-- CONTRASEÑA OPCIONAL -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Contraseña (Opcional)</label>
                            <input type="password" name="clave" class="form-control" placeholder="Opcional (por defecto será su documento)">
                        </div>

                        <!-- BOTONES -->
                        <div class="d-flex justify-content-between">
                            <a href="/clientes" class="btn btn-light">Cancelar</a>
                            <button type="submit" class="btn btn-tetra-green px-5">
                                Guardar Cliente
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- LÓGICA JAVASCRIPT: UBIGEO Y TIPO DE DOCUMENTO -->

        "HUARAZ": ["HUARAZ", "INDEPENDENCIA", "COCHABAMBA", "COLCABAMBA", "JANGAS", "LA LIBERTAD", "OLLEROS", "PAMPAS", "PIRA", "TARICA"]
    }

document.addEventListener('DOMContentLoaded', function() {
    const selectDep = document.getElementById('departamento');
    const selectProv = document.getElementById('provincia');
    const selectDist = document.getElementById('distrito');

    // 1. Cargar Departamentos
    for (let dep in ubigeoPeru) {
        let opt = document.createElement('option');
        opt.value = dep;
        opt.textContent = dep;
        selectDep.appendChild(opt);
    }

    // 2. Cambio en Departamento
    selectDep.addEventListener('change', function() {
        selectProv.innerHTML = '<option value="">Seleccione...</option>';
        selectDist.innerHTML = '<option value="">Seleccione...</option>';
        selectProv.disabled = true;
        selectDist.disabled = true;

        const depSel = this.value;
        if (depSel && ubigeoPeru[depSel]) {
            for (let prov in ubigeoPeru[depSel]) {
                let opt = document.createElement('option');
                opt.value = prov;
                opt.textContent = prov;
                selectProv.appendChild(opt);
            }
            selectProv.disabled = false;
        }
    });

    // 3. Cambio en Provincia
    selectProv.addEventListener('change', function() {
        selectDist.innerHTML = '<option value="">Seleccione...</option>';
        selectDist.disabled = true;

        const depSel = selectDep.value;
        const provSel = this.value;

        if (depSel && provSel && ubigeoPeru[depSel][provSel]) {
            ubigeoPeru[depSel][provSel].forEach(function(dist) {
                let opt = document.createElement('option');
                opt.value = dist;
                opt.textContent = dist;
                selectDist.appendChild(opt);
            });
            selectDist.disabled = false;
        }
    });

    // 4. Lógica para alternar tipos de documento
    const selectTipoDoc = document.getElementById('tipo_doc') || document.querySelector('select[name="tipo_doc"]');
    if (selectTipoDoc) {
        selectTipoDoc.addEventListener('change', actualizarFormularioPresencial);
        actualizarFormularioPresencial();
    }

    function actualizarFormularioPresencial() {
        const valorTipo = selectTipoDoc ? selectTipoDoc.value.toLowerCase() : 'dni';
        const divDni = document.getElementById('campos_dni');
        const divRuc = document.getElementById('campos_ruc');
        const inputsDni = divDni.querySelectorAll('input');
        const inputRuc = document.getElementById('razon_social');

        if (valorTipo === 'ruc') {
            divDni.style.display = 'none';
            divRuc.style.display = 'block';
            inputsDni.forEach(i => i.removeAttribute('required'));
            if (inputRuc) inputRuc.setAttribute('required', 'required');
        } else {
            divDni.style.display = 'block';
            divRuc.style.display = 'none';
            inputsDni.forEach(i => i.setAttribute('required', 'required'));
            if (inputRuc) inputRuc.removeAttribute('required');

            const esManual = (valorTipo === 'ce' || valorTipo === 'pasaporte' || valorTipo === 'otro');
            inputsDni.forEach(i => {
                if (esManual) {
                    i.removeAttribute('readonly');
                    i.classList.remove('bg-light');
                } else {
                    i.setAttribute('readonly', 'readonly');
                    i.classList.add('bg-light');
                }
            });
        }
    }
});

// Función global invocable desde Decolecta para seleccionar la ubicación devuelta por la API
function seleccionarUbigeo(dep, prov, dist) {
    const selectDep = document.getElementById('departamento');
    const selectProv = document.getElementById('provincia');
    const selectDist = document.getElementById('distrito');

    if (!dep) return;
    
    selectDep.value = dep.toUpperCase();
    selectDep.dispatchEvent(new Event('change'));

    if (prov) {
        selectProv.value = prov.toUpperCase();
        selectProv.dispatchEvent(new Event('change'));
    }

    if (dist) {
        selectDist.value = dist.toUpperCase();
    }
}
</script>

{% endblock %}
